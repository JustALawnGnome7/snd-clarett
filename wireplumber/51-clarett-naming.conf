# Focusrite Clarett / Red Thunderbolt card naming for WirePlumber.
#
# Each rule matches the card name the driver registers: clarett_model.name in
# clarett_main.c, which is also card->shortname and so api.alsa.card.name. Add a
# rule when adding a model there, with the name spelled identically — a rule
# that does not match changes nothing and reports no error. Rules for models the
# driver does not register yet are harmless; they wait for the card to appear.
#
# Why this is needed. 1cb5:0002 IS in pci.ids, as the whole-line name "Clarett":
#
#     1cb5  Focusrite Audio Engineering Ltd
#         0002  Clarett
#
# udev turns that into ID_MODEL_FROM_DATABASE, libspa-alsa turns that into
# device.product.name, and WirePlumber's alsa.lua prefers device.product.name
# over api.alsa.card.name when it derives device.description:
#
#     d = d or properties["device.product.name"]
#           or properties["api.alsa.card.name"]
#           or properties["alsa.card_name"]
#
# So every unit displays as "Clarett" — "Clarett Multichannel" once the profile
# description is appended — with no way to tell a 2Pre from an 8PreX, or to tell
# two units apart when both are plugged in.
#
# This is an override of a name WirePlumber PREFERS, not a name it lacks, so no
# choice of card name in the driver can fix it: device.product.name always wins.
# Nor can pci.ids be made more specific — every model reports the same subsystem
# ID, so there is nothing for a per-model entry to key on. And update-props takes
# literal values only, so one generic rule cannot copy api.alsa.card.name across;
# hence one rule per model.
#
# Install: `sudo make wireplumber-install` in the driver directory, which places
# this in $PREFIX/share/wireplumber/wireplumber.conf.d/ (PREFIX=/usr/local by
# default; /usr/local/share is in the XDG_DATA_DIRS default, which WirePlumber's
# config lookup honours). The DKMS target and both RPMs install it too; packages
# use /usr. /etc/wireplumber/wireplumber.conf.d/ is read as well, but leave it
# for the user's own overrides. Then `systemctl --user restart wireplumber`, or
# replug.

monitor.alsa.rules = [
  {
    matches = [ { api.alsa.card.name = "Clarett 2Pre" } ]
    actions = { update-props = { device.description = "Clarett 2Pre" } }
  }
  {
    matches = [ { api.alsa.card.name = "Clarett 4Pre" } ]
    actions = { update-props = { device.description = "Clarett 4Pre" } }
  }
  {
    matches = [ { api.alsa.card.name = "Clarett 8Pre" } ]
    actions = { update-props = { device.description = "Clarett 8Pre" } }
  }
  {
    matches = [ { api.alsa.card.name = "Clarett 8PreX" } ]
    actions = { update-props = { device.description = "Clarett 8PreX" } }
  }
  {
    matches = [ { api.alsa.card.name = "Red 4Pre" } ]
    actions = { update-props = { device.description = "Red 4Pre" } }
  }
  {
    matches = [ { api.alsa.card.name = "Red 8Pre" } ]
    actions = { update-props = { device.description = "Red 8Pre" } }
  }
  {
    matches = [ { api.alsa.card.name = "Red 8Line" } ]
    actions = { update-props = { device.description = "Red 8Line" } }
  }
  {
    matches = [ { api.alsa.card.name = "Red 16Line" } ]
    actions = { update-props = { device.description = "Red 16Line" } }
  }
]
