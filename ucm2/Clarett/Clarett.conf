Syntax 6

# ALSA UCM for the Focusrite Clarett and Red Thunderbolt interfaces (snd-clarett).
#
# alsa-lib finds this through conf.d/Clarett/Clarett.conf: "Clarett" is the
# driver name snd-clarett registers for every model, and the card name
# (clarett_model.name, e.g. "Clarett 2Pre") picks the model below. A model
# without a profile here is refused with Error, so PipeWire falls back to its
# generic Multichannel / Pro Audio profiles for it.

If.c2pre {
	Condition {
		Type String
		String1 "${CardName}"
		String2 "Clarett 2Pre"
	}
	True.Define.Profile "Clarett-2Pre"
}

If.c4pre {
	Condition {
		Type String
		String1 "${CardName}"
		String2 "Clarett 4Pre"
	}
	True.Define.Profile "Clarett-4Pre"
}

If.c8pre {
	Condition {
		Type String
		String1 "${CardName}"
		String2 "Clarett 8Pre"
	}
	True.Define.Profile "Clarett-8Pre"
}

If.c8prex {
	Condition {
		Type String
		String1 "${CardName}"
		String2 "Clarett 8PreX"
	}
	True.Define.Profile "Clarett-8PreX"
}

If.red8line {
	Condition {
		Type String
		String1 "${CardName}"
		String2 "Red 8Line"
	}
	True.Define.Profile "Red-8Line"
}

If.unsupported {
	Condition {
		Type String
		Empty "${var:-Profile}"
	}
	True.Error "No UCM profile for ${CardName} yet"
}

Comment "Focusrite ${CardName}"

SectionUseCase."HiFi" {
	Comment "Default"
	File "/Clarett/${var:Profile}-HiFi.conf"
}
