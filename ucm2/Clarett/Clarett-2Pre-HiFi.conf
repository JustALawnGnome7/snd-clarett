# Clarett 2Pre: split the 4-channel playback and 14-channel capture PCM into
# named devices. The device structure follows the upstream Focusrite Scarlett
# configs (4th Gen where they differ); the names follow alsa-scarlett-gui's
# Routing page for this model, so the desktop and the router agree, with plain
# hyphens for its en dashes (no UCM config uses an en dash). Capture devices
# take the name of the hardware input or loopback that feeds them.
#
# Playback channels (router PCM sources) and the output each one maps to
# one-to-one; names follow the device's own jack labels:
#
#   ch 0-1   Monitor Output 1-2
#   ch 2-3   Line Output 3-4, mirrored on the headphone output
#
# Capture channel order is the hardware's record block (pins 0x600-0x60d):
#
#   ch 0-1   Analogue 1-2
#   ch 2-3   S/PDIF 1-2
#   ch 4-5   Loopback 1-2 (the Routing page calls these PCM 13-14; named
#            "Loopback" here because no physical input feeds them)
#   ch 6-13  ADAT 1-8
#
# Like upstream, the names describe that one-to-one correspondence; the router
# can send any of these channels elsewhere.

Include.pcm_split.File "/common/pcm/split.conf"

Macro [
	{
		SplitPCM {
			Name "clarett2pre_stereo_out"
			Direction Playback
			Format S32_LE
			Channels 2
			HWChannels 4
			HWChannelPos0 FL
			HWChannelPos1 FR
			HWChannelPos2 FL
			HWChannelPos3 FR
		}
	}
	{
		SplitPCM {
			Name "clarett2pre_mono_in"
			Direction Capture
			Format S32_LE
			Channels 1
			HWChannels 14
			HWChannelPos0 MONO
			HWChannelPos1 MONO
			HWChannelPos2 MONO
			HWChannelPos3 MONO
			HWChannelPos4 MONO
			HWChannelPos5 MONO
			HWChannelPos6 MONO
			HWChannelPos7 MONO
			HWChannelPos8 MONO
			HWChannelPos9 MONO
			HWChannelPos10 MONO
			HWChannelPos11 MONO
			HWChannelPos12 MONO
			HWChannelPos13 MONO
		}
	}
	{
		SplitPCM {
			Name "clarett2pre_stereo_in"
			Direction Capture
			Format S32_LE
			Channels 2
			HWChannels 14
			HWChannelPos0 FL
			HWChannelPos1 FR
			HWChannelPos2 FL
			HWChannelPos3 FR
			HWChannelPos4 FL
			HWChannelPos5 FR
			HWChannelPos6 FL
			HWChannelPos7 FR
			HWChannelPos8 FL
			HWChannelPos9 FR
			HWChannelPos10 FL
			HWChannelPos11 FR
			HWChannelPos12 FL
			HWChannelPos13 FR
		}
	}
	{
		SplitPCM {
			Name "clarett2pre_adat_in"
			Direction Capture
			Format S32_LE
			Channels 8
			HWChannels 14
			HWChannelPos0 UNKNOWN
			HWChannelPos1 UNKNOWN
			HWChannelPos2 UNKNOWN
			HWChannelPos3 UNKNOWN
			HWChannelPos4 UNKNOWN
			HWChannelPos5 UNKNOWN
			HWChannelPos6 UNKNOWN
			HWChannelPos7 UNKNOWN
			HWChannelPos8 UNKNOWN
			HWChannelPos9 UNKNOWN
			HWChannelPos10 UNKNOWN
			HWChannelPos11 UNKNOWN
			HWChannelPos12 UNKNOWN
			HWChannelPos13 UNKNOWN
		}
	}
]

# Analogue Outputs

SectionDevice."Line1" {
	Comment "Line 1-2"

	Value {
		PlaybackPriority 200
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "clarett2pre_stereo_out"
		Direction Playback
		HWChannels 4
		Channels 2
		Channel0 0
		Channel1 1
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

SectionDevice."Line2" {
	Comment "Line 3-4/Headphones"

	Value {
		PlaybackPriority 100
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "clarett2pre_stereo_out"
		Direction Playback
		HWChannels 4
		Channels 2
		Channel0 2
		Channel1 3
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

# Analogue Inputs

SectionDevice."Mic1" {
	Comment "Mic/Line/Inst 1"

	Value {
		CapturePriority 500
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "clarett2pre_mono_in"
		Direction Capture
		HWChannels 14
		Channels 1
		Channel0 0
		ChannelPos0 MONO
	}
}

SectionDevice."Mic2" {
	Comment "Mic/Line/Inst 2"

	Value {
		CapturePriority 400
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "clarett2pre_mono_in"
		Direction Capture
		HWChannels 14
		Channels 1
		Channel0 1
		ChannelPos0 MONO
	}
}

# Loopback Inputs

SectionDevice."Line3" {
	Comment "Loopback 1-2"

	Value {
		CapturePriority 300
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "clarett2pre_stereo_in"
		Direction Capture
		HWChannels 14
		Channels 2
		Channel0 4
		Channel1 5
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

# Digital (Consumer) Inputs

SectionDevice."SPDIF1" {
	Comment "S/PDIF 1"

	Value {
		CapturePriority 112
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "clarett2pre_mono_in"
		Direction Capture
		HWChannels 14
		Channels 1
		Channel0 2
		ChannelPos0 MONO
	}
}

SectionDevice."SPDIF2" {
	Comment "S/PDIF 2"

	Value {
		CapturePriority 111
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "clarett2pre_mono_in"
		Direction Capture
		HWChannels 14
		Channels 1
		Channel0 3
		ChannelPos0 MONO
	}
}

# Digital (Professional) Inputs

SectionDevice."Direct1" {
	Comment "ADAT 1-8"

	Value {
		CapturePriority 48
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "clarett2pre_adat_in"
		Direction Capture
		HWChannels 14
		Channels 8
		Channel0 6
		Channel1 7
		Channel2 8
		Channel3 9
		Channel4 10
		Channel5 11
		Channel6 12
		Channel7 13
		ChannelPos0 UNKNOWN
		ChannelPos1 UNKNOWN
		ChannelPos2 UNKNOWN
		ChannelPos3 UNKNOWN
		ChannelPos4 UNKNOWN
		ChannelPos5 UNKNOWN
		ChannelPos6 UNKNOWN
		ChannelPos7 UNKNOWN
	}
}
