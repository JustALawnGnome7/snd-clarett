# Clarett 4Pre: split the 8-channel playback and 20-channel capture PCM into
# named devices. The device structure follows the upstream Focusrite Scarlett
# configs (4th Gen where they differ); the names follow alsa-scarlett-gui's
# Routing page for this model, so the desktop and the router agree, with plain
# hyphens for its en dashes (no UCM config uses an en dash). Capture devices
# take the name of the hardware input that feeds them.
#
# Playback channels (router PCM sources) and the output each one maps to
# one-to-one; names follow the device's own jack labels:
#
#   ch 0-1   Monitor Output 1-2
#   ch 2-3   Line Output 3-4, mirrored on headphone output 1
#   ch 4-5   Headphone output 2 (independent)
#   ch 6-7   S/PDIF Output 1-2
#
# Capture channel order is the hardware's record block (pins 0x600-0x613):
#
#   ch 0-7    Analogue 1-8 (1-2 Mic/Line/Inst, 3-4 Mic/Line, 5-8 Line)
#   ch 8-9    S/PDIF 1-2
#   ch 10-11  Loopback 1-2 (the Routing page calls these PCM 19-20; named
#             "Loopback" here because no physical input feeds them)
#   ch 12-19  ADAT 1-8
#
# Like upstream, the names describe that one-to-one correspondence; the router
# can send any of these channels elsewhere.

Include.pcm_split.File "/common/pcm/split.conf"

Macro [
	{
		SplitPCM {
			Name "clarett4pre_stereo_out"
			Direction Playback
			Format S32_LE
			Channels 2
			HWChannels 8
			HWChannelPos0 FL
			HWChannelPos1 FR
			HWChannelPos2 FL
			HWChannelPos3 FR
			HWChannelPos4 FL
			HWChannelPos5 FR
			HWChannelPos6 FL
			HWChannelPos7 FR
		}
	}
	{
		SplitPCM {
			Name "clarett4pre_mono_in"
			Direction Capture
			Format S32_LE
			Channels 1
			HWChannels 20
			HWChannelPos0 MONO
			HWChannelPos1 MONO
			HWChannelPos2 MONO
			HWChannelPos3 MONO
			HWChannelPos4 MONO
			HWChannelPos5 MONO
			HWChannelPos6 MONO
			HWChannelPos7 MONO
			HWChannelPos8 MONO
			HWChannelPos9 MONO
			HWChannelPos10 MONO
			HWChannelPos11 MONO
			HWChannelPos12 MONO
			HWChannelPos13 MONO
			HWChannelPos14 MONO
			HWChannelPos15 MONO
			HWChannelPos16 MONO
			HWChannelPos17 MONO
			HWChannelPos18 MONO
			HWChannelPos19 MONO
		}
	}
	{
		SplitPCM {
			Name "clarett4pre_stereo_in"
			Direction Capture
			Format S32_LE
			Channels 2
			HWChannels 20
			HWChannelPos0 FL
			HWChannelPos1 FR
			HWChannelPos2 FL
			HWChannelPos3 FR
			HWChannelPos4 FL
			HWChannelPos5 FR
			HWChannelPos6 FL
			HWChannelPos7 FR
			HWChannelPos8 FL
			HWChannelPos9 FR
			HWChannelPos10 FL
			HWChannelPos11 FR
			HWChannelPos12 FL
			HWChannelPos13 FR
			HWChannelPos14 FL
			HWChannelPos15 FR
			HWChannelPos16 FL
			HWChannelPos17 FR
			HWChannelPos18 FL
			HWChannelPos19 FR
		}
	}
	{
		SplitPCM {
			Name "clarett4pre_adat_in"
			Direction Capture
			Format S32_LE
			Channels 8
			HWChannels 20
			HWChannelPos0 UNKNOWN
			HWChannelPos1 UNKNOWN
			HWChannelPos2 UNKNOWN
			HWChannelPos3 UNKNOWN
			HWChannelPos4 UNKNOWN
			HWChannelPos5 UNKNOWN
			HWChannelPos6 UNKNOWN
			HWChannelPos7 UNKNOWN
			HWChannelPos8 UNKNOWN
			HWChannelPos9 UNKNOWN
			HWChannelPos10 UNKNOWN
			HWChannelPos11 UNKNOWN
			HWChannelPos12 UNKNOWN
			HWChannelPos13 UNKNOWN
			HWChannelPos14 UNKNOWN
			HWChannelPos15 UNKNOWN
			HWChannelPos16 UNKNOWN
			HWChannelPos17 UNKNOWN
			HWChannelPos18 UNKNOWN
			HWChannelPos19 UNKNOWN
		}
	}
]

# Analogue Outputs

SectionDevice."Line1" {
	Comment "Line 1-2"

	Value {
		PlaybackPriority 200
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "clarett4pre_stereo_out"
		Direction Playback
		HWChannels 8
		Channels 2
		Channel0 0
		Channel1 1
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

SectionDevice."Line2" {
	Comment "Line 3-4/Headphones 1"

	Value {
		PlaybackPriority 190
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "clarett4pre_stereo_out"
		Direction Playback
		HWChannels 8
		Channels 2
		Channel0 2
		Channel1 3
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

SectionDevice."Line3" {
	# not using .Headphones because this device has two headphone outputs
	Comment "Headphones 2"

	Value {
		PlaybackPriority 180
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "clarett4pre_stereo_out"
		Direction Playback
		HWChannels 8
		Channels 2
		Channel0 4
		Channel1 5
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

