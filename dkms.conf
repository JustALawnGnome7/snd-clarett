# DKMS recipe for snd-clarett.
#
# DKMS keeps the module built against whatever kernel is running, rebuilding it
# automatically on every kernel upgrade — which is what an out-of-tree driver needs
# to be usable day to day rather than after a manual `make` each update.
#
# Install with `sudo make dkms-install` from this directory (see README.md), or by
# hand: copy this directory to /usr/src/snd-clarett-<PACKAGE_VERSION>/ and run
# `dkms install snd-clarett/<PACKAGE_VERSION>`. The directory name MUST carry the
# same version as PACKAGE_VERSION below — dkms locates the source by that name.

PACKAGE_NAME="snd-clarett"

# THE single source of truth for the version. The Makefile reads PACKAGE_VERSION out
# of this file and compiles it in as MODULE_VERSION, so `modinfo snd-clarett` and the
# dkms/rpm package version cannot drift apart — a bug report quoting `modinfo` names
# exactly one tree. Bump it here and nowhere else.
PACKAGE_VERSION="0.1.1"

BUILT_MODULE_NAME[0]="snd-clarett"

# Where the module lands under /lib/modules/<kver>/. Required syntactically, but most
# distributions override it (Fedora and Debian both redirect to extra/ or
# updates/dkms/), so treat it as a fallback rather than as the installed path.
DEST_MODULE_LOCATION[0]="/kernel/sound/pci"

# The Makefile's own KDIR entry point, so the dkms build path and a plain in-tree
# `make` are the same code path — one build to keep working, not two.
#
# Note DKMS does not run this verbatim: it rewrites the leading `make` into
# `make -jN KERNELRELEASE=<kver>`. The Makefile therefore must NOT use KERNELRELEASE to
# decide whether it is being included by kbuild — see the comment at the top of it.
MAKE[0]="make KDIR=${kernel_source_dir}"

# No CLEAN. DKMS 3.x builds in a fresh copy of the source and warns that CLEAN is
# deprecated (it accepts only `true` without complaining), so there is nothing left for
# it to do here.

# Rebuild for each newly installed kernel without being asked.
AUTOINSTALL="yes"
