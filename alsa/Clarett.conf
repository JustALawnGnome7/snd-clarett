#
# ALSA card configuration for snd-clarett (Focusrite Clarett Thunderbolt and Red).
#
# alsa-lib loads cards/<driver>.conf for every sound card, keyed on the name the
# kernel driver registers the card under -- "Clarett" for every model this driver
# supports. Defining the card's front device here gives it a front:CARD=<id>,DEV=0
# PCM and, with it, an entry in ALSA's device-name hints. Applications that build
# their device list from those hints (JUCE-based ones, for example) skip the hw:,
# plughw: and sysdefault: entries, so without this file the card is missing from
# their device list altogether.
#
# front is a plain pass-through to the hardware PCM: every channel, the native
# format, and the same exclusivity as hw: -- while PipeWire or another client holds
# the card, opening it fails with "Device or resource busy".
#
# Install into alsa-lib's own data directory, normally /usr/share/alsa/cards/.
# alsa-lib reads cards/ from nowhere else; a copy under /usr/local is never seen.
#

<confdir:pcm/front.conf>

Clarett.pcm.front.!0 {
	@args [ CARD ]
	@args.CARD {
		type string
	}
	type hw
	card $CARD
}
